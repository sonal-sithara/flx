name: interop
description: >-
  Proof that flx composes with the ecosystem. Not an app — a compile target.
  If a .flx screen using BLoC, Provider and GetX together stops compiling,
  `make ci` fails here.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flx:
    path: ../../packages/flx

  # Deliberately the three most popular state-management packages, all with
  # builder-shaped widget APIs that the DSL has to be able to express.
  flutter_bloc: ^8.1.0
  provider: ^6.1.0
  get: ^4.6.6

  # UI packages, chosen because each has a differently-shaped API: named
  # constructors, several builder callbacks on one widget, widget-valued
  # arguments, deeply nested config objects.
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_slidable: ^3.1.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
