name: flx_compiler
description: >-
  The flx compiler. Transpiles .flx DSL files into Flutter Dart source,
  and generates the route table from @page annotations.
version: 0.3.0
repository: https://github.com/sonal-sithara/flx
issue_tracker: https://github.com/sonal-sithara/flx/issues
homepage: https://github.com/sonal-sithara/flx
topics: ['flutter', 'dsl', 'codegen', 'compiler']

environment:
  sdk: ^3.6.0

# The package is flx_compiler for consistency with flx_runtime and flx_lsp,
# but the command has always been `flxc` and stays that way.
executables:
  flxc: flxc

# Zero runtime dependencies, by design. Everything below is dev-only.
dev_dependencies:
  test: ^1.25.0
