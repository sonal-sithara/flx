name: flxc
description: >-
  The flx compiler. Transpiles .flx DSL files into Flutter Dart source,
  and generates the route table from @page annotations.
version: 0.1.0
repository: https://github.com/sonalsithara/flx
issue_tracker: https://github.com/sonalsithara/flx/issues
homepage: https://github.com/sonalsithara/flx
topics: ['flutter', 'dsl', 'codegen', 'compiler']

environment:
  sdk: ^3.6.0

# Zero runtime dependencies, by design. Everything below is dev-only.
dev_dependencies:
  test: ^1.25.0
